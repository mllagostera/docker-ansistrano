name: Build and push Docker images

on:
  push:
    branches: [master]
  schedule:
    # Every Sunday at 03:00 UTC, to pick up the latest security patches
    - cron: "0 3 * * 0"
  workflow_dispatch:

env:
  IMAGE: mllagostera/ansistrano
  TRIVY_IMAGE: aquasec/trivy:0.67.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set build date
        id: date
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build latest
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          pull: true
          no-cache: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ steps.date.outputs.date }}

      - name: Scan latest with Trivy (fail on fixable HIGH/CRITICAL)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            ${{ env.TRIVY_IMAGE }} image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            ${{ env.IMAGE }}:latest

      - name: Push latest
        run: |
          docker push ${{ env.IMAGE }}:latest
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:${{ steps.date.outputs.date }}

      - name: Build and push legacy
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.legacy
          push: true
          pull: true
          no-cache: true
          tags: |
            ${{ env.IMAGE }}:legacy
            ${{ env.IMAGE }}:legacy-${{ github.sha }}
